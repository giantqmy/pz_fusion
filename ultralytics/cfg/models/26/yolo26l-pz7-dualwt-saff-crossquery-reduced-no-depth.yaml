# Cross-query DualWT with per-modality residual scales/norms and plain 2C-to-C lateral projections.
nc: 1
channels: 6
ch: 6
scale: l
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # DualWT args: [total output channels, downsample stride, ConvNeXt depth].
  # Each lateral separately normalizes RGB/DoLP before Cat and a plain 1x1 Conv maps 2C to C.
  # Args: [top-k routed windows, windows per spatial axis, K/V pooling ratio].
  - [-1, 1, nn.Identity, []]                              # 0 RGB + original three-channel DoLP
  - [0, 1, PZDualWTStage, [128, 4, 1]]                    # 1 P2 dual state: 2C=128
  - [1, 1, PZSAFFCrossQueryReducedLateral, [2, 16, 4]]    # 2 P2 lateral: C=64
  - [1, 1, PZDualWTStage, [256, 2, 1]]                    # 3 P3 dual state: 2C=256
  - [3, 1, PZSAFFCrossQueryReducedLateral, [2, 8, 4]]     # 4 P3 lateral: C=128
  - [3, 1, PZDualWTStage, [512, 2, 2]]                    # 5 P4 dual state: 2C=512
  - [5, 1, PZSAFFCrossQueryReducedLateral, [4, 4, 4]]     # 6 P4 lateral: C=256
  - [5, 1, PZDualWTStage, [1024, 2, 1]]                   # 7 P5 dual state: 2C=512 after L-scale cap
  - [7, 1, PZSAFFCrossQueryReducedLateral, [8, 4, 2]]     # 8 P5 lateral: C=256

head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]             # 9
  - [[-1, 6], 1, Concat, [1]]                            # 10 P4
  - [-1, 2, C3k2, [512, False]]                          # 11
  - [-1, 1, nn.Upsample, [None, 2, nearest]]             # 12
  - [[-1, 4], 1, Concat, [1]]                            # 13 P3
  - [-1, 2, C3k2, [256, False]]                          # 14
  - [-1, 1, nn.Upsample, [None, 2, nearest]]             # 15
  - [[-1, 2], 1, Concat, [1]]                            # 16 P2
  - [-1, 2, C3k2, [128, False]]                          # 17
  - [-1, 1, Conv, [128, 3, 2]]                           # 18
  - [[-1, 14], 1, Concat, [1]]                           # 19
  - [-1, 2, C3k2, [256, False]]                          # 20
  - [-1, 1, Conv, [256, 3, 2]]                           # 21
  - [[-1, 11], 1, Concat, [1]]                           # 22
  - [-1, 2, C3k2, [512, False]]                          # 23
  - [-1, 1, Conv, [512, 3, 2]]                           # 24
  - [[-1, 8], 1, Concat, [1]]                            # 25
  - [-1, 2, C3k2, [1024, True, 0.5, True]]               # 26
  - [[17, 20, 23, 26], 1, Detect, [nc]]                  # 27 Detect(P2, P3, P4, P5)
