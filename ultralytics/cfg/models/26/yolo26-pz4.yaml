# YOLO26 RGB + DoLP ablation: visual PIM backbone without depth or gating.
nc: 6
channels: 4
ch: 4
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, PZPIMStage, [64, 2, 1]]    # 0 P1/2
  - [-1, 1, PZPIMStage, [128, 2, 1]]   # 1 P2/4
  - [-1, 1, PZPIMStage, [256, 2, 1]]   # 2 P3/8
  - [-1, 1, PZPIMStage, [512, 2, 2]]   # 3 P4/16
  - [-1, 1, PZPIMStage, [1024, 2, 2]]  # 4 P5/32

head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 3], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]          # 7 P4
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]]          # 10 P3
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]          # 13 P4
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True, 0.5, True]]  # 16 P5
  - [[10, 13, 16], 1, Detect, [nc]]
