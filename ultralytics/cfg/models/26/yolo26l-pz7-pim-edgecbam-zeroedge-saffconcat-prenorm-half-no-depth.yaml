# L-scale zero-edge PIM with independent RGB/DoLP LayerNorm and SAFF 2C-to-C output fusion.
nc: 6
channels: 6
ch: 6
scale: l
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # SAFF args: [topk, windows per side, KV pooling ratio, output channel reduction].
  # Each modality has C channels; reduction=2 projects their 2C concatenation to C.
  - [-1, 1, nn.Identity, []]                                 # 0 RGB + color DoLP
  - [0, 1, PZDualEdgeWTZeroStage, [128, 4, 1, 0.0]]           # 1 P2 dual state: 128
  - [1, 1, PZSAFFConcatPreNormLateral, [2, 16, 4, 2]]         # 2 P2 lateral: 64
  - [1, 1, PZDualEdgeWTZeroStage, [256, 2, 1, 0.0]]           # 3 P3 dual state: 256
  - [3, 1, PZSAFFConcatPreNormLateral, [2, 8, 4, 2]]          # 4 P3 lateral: 128
  - [3, 1, PZDualEdgeWTZeroStage, [512, 2, 2, 0.0]]           # 5 P4 dual state: 512
  - [5, 1, PZSAFFConcatPreNormLateral, [4, 4, 4, 2]]          # 6 P4 lateral: 256
  - [5, 1, PZDualEdgeWTZeroStage, [1024, 2, 1, 0.0]]          # 7 P5 dual state: 512 (L max_channels)
  - [7, 1, PZSAFFConcatPreNormLateral, [8, 4, 2, 2]]          # 8 P5 lateral: 256

head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]                  # 9
  - [[-1, 6], 1, Concat, [1]]                               # 10 P4
  - [-1, 2, C3k2, [512, False]]                             # 11
  - [-1, 1, nn.Upsample, [None, 2, nearest]]                  # 12
  - [[-1, 4], 1, Concat, [1]]                               # 13 P3
  - [-1, 2, C3k2, [256, False]]                             # 14
  - [-1, 1, nn.Upsample, [None, 2, nearest]]                  # 15
  - [[-1, 2], 1, Concat, [1]]                               # 16 P2
  - [-1, 2, C3k2, [128, False]]                             # 17
  - [-1, 1, Conv, [128, 3, 2]]                              # 18
  - [[-1, 14], 1, Concat, [1]]                              # 19
  - [-1, 2, C3k2, [256, False]]                             # 20
  - [-1, 1, Conv, [256, 3, 2]]                              # 21
  - [[-1, 11], 1, Concat, [1]]                              # 22
  - [-1, 2, C3k2, [512, False]]                             # 23
  - [-1, 1, Conv, [512, 3, 2]]                              # 24
  - [[-1, 8], 1, Concat, [1]]                               # 25
  - [-1, 2, C3k2, [1024, True, 0.5, True]]                  # 26
  - [[17, 20, 23, 26], 1, Detect, [nc]]                     # 27 P2-P5
