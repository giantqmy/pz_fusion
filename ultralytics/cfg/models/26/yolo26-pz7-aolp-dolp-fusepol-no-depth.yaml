# RGB/AoLP/DoLP input; FusePol forms RGB plus one fused polarization stream.
nc: 6
channels: 9
ch: 9
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, FusePol, []]                       # 0 RGB(3) + fused polarization(3)
  - [0, 1, PZDualPIMStage, [128, 4, 1]]       # 1 P2 dual state
  - [1, 1, PZSAFFConcatLateral, [2, 16, 4]]   # 2 P2 lateral
  - [1, 1, PZDualPIMStage, [256, 2, 1]]       # 3 P3 dual state
  - [3, 1, PZSAFFConcatLateral, [2, 8, 4]]    # 4 P3 lateral
  - [3, 1, PZDualPIMStage, [512, 2, 2]]       # 5 P4 dual state
  - [5, 1, PZSAFFConcatLateral, [4, 4, 4]]    # 6 P4 lateral
  - [5, 1, PZDualPIMStage, [1024, 2, 1]]      # 7 P5 dual state
  - [7, 1, PZSAFFConcatLateral, [8, 4, 2]]    # 8 P5 lateral

head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C3k2, [128, False]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True, 0.5, True]]
  - [[17, 20, 23, 26], 1, Detect, [nc]]
