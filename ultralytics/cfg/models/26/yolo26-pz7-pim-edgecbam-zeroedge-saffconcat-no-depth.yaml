# RGB/color-DoLP dual wavelet PIM; learnable DoLP edge residual starts at zero.
nc: 6
channels: 6
ch: 6
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # Six visual channels: RGB (3) + color DoLP (3).
  # Final stage argument sets the learnable edge residual's initial gain.
  - [-1, 1, nn.Identity, []]                              # 0 RGB + color DoLP
  - [0, 1, PZDualEdgeWTZeroStage, [128, 4, 1, 0.0]]      # 1 P2 dual state
  - [1, 1, PZSAFFConcatLateral, [2, 16, 4]]              # 2 P2 lateral
  - [1, 1, PZDualEdgeWTZeroStage, [256, 2, 1, 0.0]]      # 3 P3 dual state
  - [3, 1, PZSAFFConcatLateral, [2, 8, 4]]               # 4 P3 lateral
  - [3, 1, PZDualEdgeWTZeroStage, [512, 2, 2, 0.0]]      # 5 P4 dual state
  - [5, 1, PZSAFFConcatLateral, [4, 4, 4]]               # 6 P4 lateral
  - [5, 1, PZDualEdgeWTZeroStage, [1024, 2, 1, 0.0]]     # 7 P5 dual state
  - [7, 1, PZSAFFConcatLateral, [8, 4, 2]]               # 8 P5 lateral

head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]             # 9
  - [[-1, 6], 1, Concat, [1]]                            # 10 P4
  - [-1, 2, C3k2, [512, False]]                          # 11
  - [-1, 1, nn.Upsample, [None, 2, nearest]]             # 12
  - [[-1, 4], 1, Concat, [1]]                            # 13 P3
  - [-1, 2, C3k2, [256, False]]                          # 14
  - [-1, 1, nn.Upsample, [None, 2, nearest]]             # 15
  - [[-1, 2], 1, Concat, [1]]                           # 16 P2
  - [-1, 2, C3k2, [128, False]]                         # 17
  - [-1, 1, Conv, [128, 3, 2]]                          # 18
  - [[-1, 14], 1, Concat, [1]]                         # 19
  - [-1, 2, C3k2, [256, False]]                        # 20
  - [-1, 1, Conv, [256, 3, 2]]                         # 21
  - [[-1, 11], 1, Concat, [1]]                         # 22
  - [-1, 2, C3k2, [512, False]]                        # 23
  - [-1, 1, Conv, [512, 3, 2]]                         # 24
  - [[-1, 8], 1, Concat, [1]]                         # 25
  - [-1, 2, C3k2, [1024, True, 0.5, True]]            # 26
  - [[17, 20, 23, 26], 1, Detect, [nc]]               # 27 P2-P5
