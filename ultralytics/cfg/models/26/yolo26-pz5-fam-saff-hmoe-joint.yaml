# RGB/DoLP dual FAM backbone; SAFF + HMoE Joint laterals feed a P2-P5 YOLO26 PAN.
nc: 6
channels: 5
ch: 5
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # Dual FAM args: [total channels, downsample stride, ConvNeXt depth].
  # SAFF args: [topk, windows per side, KV pooling ratio].
  - [-1, 1, nn.Identity, []]                       # 0 raw RGB, DoLP, depth
  - [0, 1, PZDualFAMStage, [128, 4, 1]]            # 1 P2 dual state, two stride-2 stems
  - [1, 1, PZSAFFLateral, [2, 16, 4]]              # 2 P2 visual lateral
  - [0, 1, PZDepthStage, [2, 32]]                  # 3 depth P1
  - [3, 1, PZDepthStage, [2, 32]]                  # 4 depth P2
  - [[2, 4], 1, PZHMoEJointFusion, [4, 2, 4]]      # 5 fused P2 lateral
  - [1, 1, PZDualFAMStage, [256, 2, 1]]            # 6 P3 continues FAM, not the fused lateral
  - [6, 1, PZSAFFLateral, [2, 8, 4]]               # 7 P3 visual lateral
  - [4, 1, PZDepthStage, [2, 32]]                  # 8 depth P3
  - [[7, 8], 1, PZHMoEJointFusion, [4, 2, 4]]      # 9 fused P3 lateral
  - [6, 1, PZDualFAMStage, [512, 2, 2]]            # 10 P4 dual state
  - [10, 1, PZSAFFLateral, [4, 4, 4]]              # 11 P4 visual lateral
  - [8, 1, PZDepthStage, [2, 32]]                  # 12 depth P4
  - [[11, 12], 1, PZHMoEJointFusion, [4, 2, 4]]    # 13 fused P4 lateral
  - [10, 1, PZDualFAMStage, [1024, 2, 1]]          # 14 P5 dual state
  - [14, 1, PZSAFFLateral, [8, 4, 2]]              # 15 P5 visual lateral
  - [12, 1, PZDepthStage, [2, 32]]                 # 16 depth P5
  - [[15, 16], 1, PZHMoEJointFusion, [4, 2, 4]]    # 17 fused P5 lateral

head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]       # 18
  - [[-1, 13], 1, Concat, [1]]                    # 19 P4 lateral
  - [-1, 2, C3k2, [512, False]]                   # 20
  - [-1, 1, nn.Upsample, [None, 2, nearest]]       # 21
  - [[-1, 9], 1, Concat, [1]]                     # 22 P3 lateral
  - [-1, 2, C3k2, [256, False]]                   # 23
  - [-1, 1, nn.Upsample, [None, 2, nearest]]       # 24
  - [[-1, 5], 1, Concat, [1]]                     # 25 P2 lateral
  - [-1, 2, C3k2, [128, False]]                   # 26 P2 detection feature
  - [-1, 1, Conv, [128, 3, 2]]                    # 27
  - [[-1, 23], 1, Concat, [1]]                    # 28
  - [-1, 2, C3k2, [256, False]]                   # 29 P3 detection feature
  - [-1, 1, Conv, [256, 3, 2]]                    # 30
  - [[-1, 20], 1, Concat, [1]]                    # 31
  - [-1, 2, C3k2, [512, False]]                   # 32 P4 detection feature
  - [-1, 1, Conv, [512, 3, 2]]                    # 33
  - [[-1, 17], 1, Concat, [1]]                    # 34
  - [-1, 2, C3k2, [1024, True, 0.5, True]]        # 35 P5 detection feature
  - [[26, 29, 32, 35], 1, Detect, [nc]]           # 36 Detect(P2, P3, P4, P5)
