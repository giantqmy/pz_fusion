# RGB/color DoLP dual PIM backbone with SAFFConcat and depth HMoE Joint on P2-P5.
nc: 6
channels: 7
ch: 7
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # PIM args: [total channels, stride, ConvNeXt depth].
  # SAFFConcat args: [topk, windows per side, KV pooling ratio].
  - [-1, 1, nn.Identity, []]                       # 0 RGB (3), color DoLP (3), depth (1)
  - [0, 1, PZDualPIMStage, [128, 4, 1]]            # 1 P2 dual state
  - [1, 1, PZSAFFConcatLateral, [2, 16, 4]]        # 2 P2 visual lateral
  - [0, 1, PZDepthStage, [2, 32]]                  # 3 depth P1
  - [3, 1, PZDepthStage, [2, 32]]                  # 4 depth P2
  - [[2, 4], 1, PZHMoEJointFusion, [4, 2, 4]]      # 5 fused P2
  - [1, 1, PZDualPIMStage, [256, 2, 1]]            # 6 P3 dual state
  - [6, 1, PZSAFFConcatLateral, [2, 8, 4]]         # 7 P3 visual lateral
  - [4, 1, PZDepthStage, [2, 32]]                  # 8 depth P3
  - [[7, 8], 1, PZHMoEJointFusion, [4, 2, 4]]      # 9 fused P3
  - [6, 1, PZDualPIMStage, [512, 2, 2]]            # 10 P4 dual state
  - [10, 1, PZSAFFConcatLateral, [4, 4, 4]]        # 11 P4 visual lateral
  - [8, 1, PZDepthStage, [2, 32]]                  # 12 depth P4
  - [[11, 12], 1, PZHMoEJointFusion, [4, 2, 4]]    # 13 fused P4
  - [10, 1, PZDualPIMStage, [1024, 2, 1]]          # 14 P5 dual state
  - [14, 1, PZSAFFConcatLateral, [8, 4, 2]]        # 15 P5 visual lateral
  - [12, 1, PZDepthStage, [2, 32]]                 # 16 depth P5
  - [[15, 16], 1, PZHMoEJointFusion, [4, 2, 4]]    # 17 fused P5

head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]       # 18
  - [[-1, 13], 1, Concat, [1]]                    # 19
  - [-1, 2, C3k2, [512, False]]                   # 20
  - [-1, 1, nn.Upsample, [None, 2, nearest]]       # 21
  - [[-1, 9], 1, Concat, [1]]                     # 22
  - [-1, 2, C3k2, [256, False]]                   # 23
  - [-1, 1, nn.Upsample, [None, 2, nearest]]       # 24
  - [[-1, 5], 1, Concat, [1]]                     # 25
  - [-1, 2, C3k2, [128, False]]                   # 26 P2
  - [-1, 1, Conv, [128, 3, 2]]                    # 27
  - [[-1, 23], 1, Concat, [1]]                    # 28
  - [-1, 2, C3k2, [256, False]]                   # 29 P3
  - [-1, 1, Conv, [256, 3, 2]]                    # 30
  - [[-1, 20], 1, Concat, [1]]                    # 31
  - [-1, 2, C3k2, [512, False]]                   # 32 P4
  - [-1, 1, Conv, [512, 3, 2]]                    # 33
  - [[-1, 17], 1, Concat, [1]]                    # 34
  - [-1, 2, C3k2, [1024, True, 0.5, True]]        # 35 P5
  - [[26, 29, 32, 35], 1, Detect, [nc]]           # 36
