# PZ5: P2-P5 HMoE with paired visual/depth outputs mapped from 2C to C.
nc: 6
channels: 5
ch: 5
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, nn.Identity, []]                 # 0 raw five-channel input
  - [-1, 1, PZPIMStage, [64, 2, 1]]           # 1 P1/2 visual
  - [-1, 1, PZPIMStage, [128, 2, 1]]          # 2 P2/4 visual
  - [0, 1, PZDepthStage, [2, 32]]            # 3 depth P1/2
  - [3, 1, PZDepthStage, [2, 32]]            # 4 depth P2/4
  - [[2, 4], 1, PZHMoEJointFusion, [4, 2, 4]] # 5 fused P2
  - [-1, 1, PZPIMStage, [256, 2, 1]]         # 6 P3/8 visual
  - [4, 1, PZDepthStage, [2, 32]]            # 7 depth P3/8
  - [[6, 7], 1, PZHMoEJointFusion, [4, 2, 4]] # 8 fused P3
  - [-1, 1, PZPIMStage, [512, 2, 2]]         # 9 P4/16 visual
  - [7, 1, PZDepthStage, [2, 32]]            # 10 depth P4/16
  - [[9, 10], 1, PZHMoEJointFusion, [4, 2, 4]] # 11 fused P4
  - [-1, 1, PZPIMStage, [1024, 2, 2]]        # 12 P5/32 visual
  - [10, 1, PZDepthStage, [2, 32]]           # 13 depth P5/32
  - [[12, 13], 1, PZHMoEJointFusion, [4, 2, 4]] # 14 fused P5

head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 17], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True, 0.5, True]]
  - [[20, 23, 26], 1, Detect, [nc]]
